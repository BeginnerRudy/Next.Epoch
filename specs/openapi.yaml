openapi: 3.1.0
info:
  title: Next.Epoch API
  description: |
    **Next.Epoch** - AI Frontier Intelligence Platform

    Track the cutting edge of AI research, news, and tools.

    ## Authentication
    All endpoints require an API key passed via the `X-API-Key` header.

    ## Rate Limiting
    - Default: 100 requests/minute
    - Digest generation: 10 requests/minute
  version: 0.1.0
  contact:
    name: Next.Epoch Support
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.nextepoch.ai/v1
    description: Production (future)

tags:
  - name: Content
    description: Access curated AI content
  - name: Digests
    description: AI-generated summaries and briefings
  - name: Sources
    description: Manage content sources
  - name: Runs
    description: Processing runs for ingestion and agent jobs
  - name: Fields
    description: Field taxonomy and field-centric views
  - name: Trends
    description: AI field trend analysis
  - name: Health
    description: System health checks

paths:
  # ============================================================
  # CONTENT ENDPOINTS
  # ============================================================
  /content:
    get:
      tags: [Content]
      summary: List all content
      description: Retrieve paginated list of all ingested content, with filtering options.
      operationId: listContent
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/TagsFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/SinceFilter'
        - $ref: '#/components/parameters/UntilFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [published_at, relevance_score, importance_score]
            default: published_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of content items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /content/{id}:
    get:
      tags: [Content]
      summary: Get content by ID
      description: Retrieve a single content item with full details.
      operationId: getContent
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Content item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /content/{id}/feedback:
    get:
      tags: [Content]
      summary: List feedback for content
      description: Retrieve recorded feedback for a content item (useful for evaluation dashboards).
      operationId: listContentFeedback
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FeedbackKind'
      responses:
        '200':
          description: Paginated feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Content]
      summary: Submit feedback for content
      description: Submit explicit feedback used for evaluation and improving ranking/summaries.
      operationId: createContentFeedback
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /content/{id}/reprocess:
    post:
      tags: [Content]
      summary: Reprocess a content item
      description: |
        Operator endpoint to trigger reprocessing for a single content item (async).
        Typical uses: re-summarize, re-score, or re-enrich.
      operationId: reprocessContent
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessContentRequest'
      responses:
        '202':
          description: Reprocess started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /content/search:
    get:
      tags: [Content]
      summary: Search content
      description: Full-text search across all content.
      operationId: searchContent
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/CategoryFilter'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContentResponse'

  # ============================================================
  # FIELDS ENDPOINTS
  # ============================================================
  /fields:
    get:
      tags: [Fields]
      summary: List fields
      description: List configured fields (taxonomy). Useful for UI navigation.
      operationId: listFields
      responses:
        '200':
          description: List of fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /fields/{id}:
    get:
      tags: [Fields]
      summary: Get field by ID
      operationId: getField
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Field details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # PAPERS ENDPOINTS
  # ============================================================
  /papers:
    get:
      tags: [Content]
      summary: List papers
      description: Retrieve papers from arXiv and other research sources.
      operationId: listPapers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SinceFilter'
        - $ref: '#/components/parameters/UntilFilter'
        - name: category
          in: query
          description: Filter by arXiv category
          schema:
            type: string
            example: cs.AI
        - $ref: '#/components/parameters/TagsFilter'
      responses:
        '200':
          description: Paginated list of papers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaperResponse'

  /papers/{id}:
    get:
      tags: [Content]
      summary: Get paper by ID
      operationId: getPaper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paper details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paper'
        '404':
          $ref: '#/components/responses/NotFound'

  /papers/{id}/summary:
    get:
      tags: [Content]
      summary: Get AI-generated paper summary
      description: Returns an AI-generated summary of the paper. May be cached or generated on-demand.
      operationId: getPaperSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: style
          in: query
          description: Summary style
          schema:
            type: string
            enum: [brief, detailed, eli5, technical]
            default: brief
      responses:
        '200':
          description: Paper summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'

  # ============================================================
  # DIGESTS ENDPOINTS
  # ============================================================
  /digests:
    get:
      tags: [Digests]
      summary: List digests
      description: Retrieve previously generated digests.
      operationId: listDigests
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/DigestType'
      responses:
        '200':
          description: Paginated list of digests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDigestResponse'

    post:
      tags: [Digests]
      summary: Generate new digest
      description: |
        Trigger generation of a new digest. This is an async operation.
        Returns immediately with a digest ID that can be polled for status.
      operationId: createDigest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDigestRequest'
      responses:
        '202':
          description: Digest generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestJob'
        '429':
          $ref: '#/components/responses/RateLimited'

  /digests/latest:
    get:
      tags: [Digests]
      summary: Get latest digest
      description: Retrieve the most recent digest of a given type.
      operationId: getLatestDigest
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DigestType'
      responses:
        '200':
          description: Latest digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Digest'
        '404':
          description: No digest found for this type

  /digests/{id}:
    get:
      tags: [Digests]
      summary: Get digest by ID
      operationId: getDigest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Digest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Digest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # SOURCES ENDPOINTS
  # ============================================================
  /sources:
    get:
      tags: [Sources]
      summary: List configured sources
      description: Get all configured content sources and their status.
      operationId: listSources
      responses:
        '200':
          description: List of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceConfig'

  /sources/{id}:
    get:
      tags: [Sources]
      summary: Get source details
      operationId: getSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConfig'

    patch:
      tags: [Sources]
      summary: Update source configuration
      operationId: updateSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConfig'

  /sources/{id}/refresh:
    post:
      tags: [Sources]
      summary: Trigger source refresh
      description: Manually trigger a refresh for a specific source.
      operationId: refreshSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Refresh triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job_id:
                    type: string
                    format: uuid
                    description: Processing run id (see /runs/{id})

  # ============================================================
  # RUNS ENDPOINTS
  # ============================================================
  /runs:
    get:
      tags: [Runs]
      summary: List processing runs
      description: Retrieve recent processing runs (ingestion, summarization, scoring, digest generation).
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/RunType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/SourceType'
      responses:
        '200':
          description: Paginated list of processing runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunResponse'

    post:
      tags: [Runs]
      summary: Create a processing run
      description: |
        Trigger a processing run (e.g., ingest/enrich/summarize/score/digest).
        This is intended for operators and automation.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /runs/{id}:
    get:
      tags: [Runs]
      summary: Get processing run by ID
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Processing run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRun'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # TRENDS ENDPOINTS
  # ============================================================
  /trends:
    get:
      tags: [Trends]
      summary: Get current trends
      description: Retrieve detected trends in the AI field.
      operationId: listTrends
      parameters:
        - name: momentum
          in: query
          schema:
            type: string
            enum: [rising, stable, declining]
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: List of trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trend'

  /trends/{id}:
    get:
      tags: [Trends]
      summary: Get trend details
      operationId: getTrend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trend details with related content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendDetails'

  # ============================================================
  # HEALTH ENDPOINTS
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Basic health check endpoint.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Check if service is ready to accept requests.
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageParam:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    ContentId:
      name: id
      in: path
      required: true
      description: Content item ID
      schema:
        type: string
        format: uuid

    RunId:
      name: id
      in: path
      required: true
      description: Processing run ID
      schema:
        type: string
        format: uuid

    SourceFilter:
      name: source
      in: query
      description: Filter by source
      schema:
        $ref: '#/components/schemas/SourceType'

    TypeFilter:
      name: type
      in: query
      description: Filter by content type
      schema:
        $ref: '#/components/schemas/ContentType'

    TagsFilter:
      name: tags
      in: query
      description: Filter by tags (comma-separated)
      schema:
        type: string
        example: llm,transformers

    CategoryFilter:
      name: category
      in: query
      description: Filter by a broad category / field id
      schema:
        type: string
        example: agents

    SinceFilter:
      name: since
      in: query
      description: Filter content published after this date
      schema:
        type: string
        format: date-time

    UntilFilter:
      name: until
      in: query
      description: Filter content published before this date
      schema:
        type: string
        format: date-time

  schemas:
    # ----------------------------------------------------------
    # Enums
    # ----------------------------------------------------------
    SourceType:
      type: string
      enum:
        - arxiv
        - github
        - twitter
        - anthropic
        - verge
        - venturebeat
        - techcrunch
        - custom

    ContentType:
      type: string
      enum:
        - paper
        - article
        - repository
        - social
        - announcement

    DigestType:
      type: string
      enum:
        - flash
        - daily
        - weekly
        - deep_dive

    FieldStatus:
      type: string
      enum: [active, deprecated]

    TrendMomentum:
      type: string
      enum:
        - rising
        - stable
        - declining

    RunType:
      type: string
      enum:
        - ingest
        - enrich
        - summarize
        - score
        - digest

    RunStatus:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed

    # ----------------------------------------------------------
    # Core Models
    # ----------------------------------------------------------
    Author:
      type: object
      properties:
        name:
          type: string
        affiliation:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
      required:
        - name

    Paper:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceType'
        external_id:
          type: string
          description: arXiv ID or similar
        title:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        abstract:
          type: string
        url:
          type: string
          format: uri
        pdf_url:
          type: string
          format: uri
          nullable: true
        published_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        summary:
          type: string
          nullable: true
          description: AI-generated summary
      required:
        - id
        - source
        - title
        - authors
        - abstract
        - url
        - published_at

    ContentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ContentType'
        source:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
        summary:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        relevance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        importance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        novelty_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Novelty vs recent baseline (optional)
        frontier_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Combined frontier ranking score (optional)
        score_breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
          description: Evidence signals used for scoring/explainability
        provenance:
          $ref: '#/components/schemas/ContentProvenance'
        categories:
          type: array
          items:
            type: string
          description: Broad categories / fields
        tags:
          type: array
          items:
            type: string
        published_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - source
        - title
        - url
        - published_at

    Field:
      type: object
      properties:
        id:
          type: string
          description: Stable field id (e.g., "agents")
        name:
          type: string
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/FieldStatus'
      required:
        - id
        - name
        - status

    Signal:
      type: object
      properties:
        key:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        weight:
          type: number
          format: float
          nullable: true
        source:
          type: string
          nullable: true
      required:
        - key
        - value

    ScoreBreakdown:
      type: object
      properties:
        relevance:
          type: number
          format: float
        importance:
          type: number
          format: float
        novelty:
          type: number
          format: float
          nullable: true
        frontier:
          type: number
          format: float
          nullable: true
        explanation:
          type: string
          nullable: true
      required:
        - relevance
        - importance

    ContentProvenance:
      type: object
      properties:
        fetched_at:
          type: string
          format: date-time
        fetched_from:
          type: string
        parser:
          type: string
        parser_version:
          type: string
        content_hash:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
      required:
        - fetched_at
        - fetched_from
        - parser
        - parser_version

    FeedbackKind:
      type: string
      enum: [relevance, value, summary_quality]

    CreateFeedbackRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/FeedbackKind'
        rating:
          type: integer
          description: Rating scale depends on kind; MVP uses 1-5.
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
      required:
        - kind
        - rating

    Feedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/FeedbackKind'
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          nullable: true
      required:
        - id
        - content_id
        - kind
        - rating
        - created_at

    PaginatedFeedbackResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination

    Summary:
      type: object
      properties:
        content_id:
          type: string
        style:
          type: string
          enum: [brief, detailed, eli5, technical]
        summary:
          type: string
        key_points:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
      required:
        - content_id
        - style
        - summary
        - generated_at

    Digest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DigestType'
        title:
          type: string
        executive_summary:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        sections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              summary:
                type: string
              items:
                type: array
                items:
                  $ref: '#/components/schemas/ContentItem'
        highlights:
          type: array
          items:
            type: string
        stats:
          type: object
          properties:
            total_items:
              type: integer
            papers_count:
              type: integer
            articles_count:
              type: integer
            repos_count:
              type: integer
        generated_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - executive_summary
        - period_start
        - period_end
        - generated_at

    DigestJob:
      type: object
      properties:
        job_id:
          type: string
        digest_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    ProcessingRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RunType'
        status:
          $ref: '#/components/schemas/RunStatus'
        source:
          $ref: '#/components/schemas/SourceType'
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        stats:
          type: object
          nullable: true
          description: Free-form stats (e.g., items_fetched, items_created, llm_calls)
        error:
          type: string
          nullable: true
      required:
        - id
        - type
        - status
        - started_at

    CreateRunRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RunType'
        source:
          $ref: '#/components/schemas/SourceType'
          nullable: true
        parameters:
          type: object
          nullable: true
          description: Optional run parameters (implementation-defined)
      required:
        - type

    ReprocessContentRequest:
      type: object
      properties:
        steps:
          type: array
          description: Which processing steps to re-run.
          items:
            type: string
            enum: [enrich, summarize, score]
        parameters:
          type: object
          nullable: true
          description: Optional step-specific parameters (implementation-defined)
      required:
        - steps

    ReprocessContentResponse:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        message:
          type: string
      required:
        - run_id
        - message

    PaginatedRunResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingRun'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateDigestRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DigestType'
        period_start:
          type: string
          format: date-time
          description: Optional, defaults based on digest type
        period_end:
          type: string
          format: date-time
          description: Optional, defaults to now
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceType'
          description: Optional, defaults to all sources
        tags:
          type: array
          items:
            type: string
          description: Optional topic filter
      required:
        - type

    Trend:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        momentum:
          $ref: '#/components/schemas/TrendMomentum'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        first_detected:
          type: string
          format: date-time
        keywords:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - momentum
        - confidence

    TrendDetails:
      allOf:
        - $ref: '#/components/schemas/Trend'
        - type: object
          properties:
            related_content:
              type: array
              items:
                $ref: '#/components/schemas/ContentItem'

    SourceConfig:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        name:
          type: string
        enabled:
          type: boolean
        refresh_interval:
          type: integer
          description: Minutes between refreshes
        last_fetched:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, error, disabled]
        error_count:
          type: integer

    UpdateSourceRequest:
      type: object
      properties:
        enabled:
          type: boolean
        refresh_interval:
          type: integer
          minimum: 5
          maximum: 1440

    # ----------------------------------------------------------
    # Pagination
    # ----------------------------------------------------------
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    PaginatedContentResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PaginatedPaperResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Paper'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PaginatedDigestResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Digest'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ----------------------------------------------------------
    # Errors
    # ----------------------------------------------------------
    APIError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'

security:
  - ApiKeyAuth: []
