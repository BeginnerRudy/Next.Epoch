services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: next-epoch-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_epoch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: next-epoch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: next-epoch-api
    environment:
      - NEXT_EPOCH_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/next_epoch
      - NEXT_EPOCH_DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/next_epoch
      - NEXT_EPOCH_REDIS_URL=redis://redis:6379
      - NEXT_EPOCH_LLM_API_KEY=${OPENAI_API_KEY:-}
      - NEXT_EPOCH_DEBUG=false
      # HTTP proxy for arXiv access in China (uses host machine's proxy via Docker networking)
      - NEXT_EPOCH_HTTP_PROXY=${NEXT_EPOCH_HTTP_PROXY:-http://host.docker.internal:7897}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: next-epoch-web
    environment:
      # Internal API URL for server-side API proxy routes
      - BACKEND_API_URL=http://api:8000
      # Public URL (for client-side, not used with API routes)
      - NEXT_PUBLIC_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Database migrations (run once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: next-epoch-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - NEXT_EPOCH_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/next_epoch
      - NEXT_EPOCH_DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/next_epoch
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
